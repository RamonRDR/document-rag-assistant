name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-db-password
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RAG_DATABASE_URL: postgresql+psycopg://rag:ci-db-password@localhost:5432/rag
      RAG_API_KEY: test-api-key-with-more-than-24-characters
      RAG_EMBEDDING_PROVIDER: local
      RAG_LLM_PROVIDER: extractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Apply Alembic migrations
        run: alembic upgrade head
      - name: Tests (units, API, PostgreSQL and pgvector)
        run: pytest -q
      - name: Evaluate fictional retrieval corpus
        run: python -m document_rag.evaluation --output eval-report.json
      - name: Upload deterministic evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: eval-report.json
          if-no-files-found: ignore
      - name: Docker build
        run: docker build --tag document-rag-assistant:ci .
