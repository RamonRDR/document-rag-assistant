[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "document-rag-assistant"
version = "0.1.0"
description = "Traceable document RAG with FastAPI, PostgreSQL and pgvector"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ramon Rodriguez" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.5,<1",
  "pymupdf>=1.26.6,<2",
  "python-multipart>=0.0.18",
  "httpx>=0.28,<1",
  "openai>=1.100,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]
[project.scripts]
rag-evaluate = "document_rag.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_rag"]

[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires PostgreSQL with the vector extension"]
